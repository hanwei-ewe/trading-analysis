services:
  web:
    build: .
    image: trading-analysis-web
    container_name: trading-analysis-web
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    environment:
      TZ: Asia/Singapore
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./journal:/app/journal
      - ./results:/app/results
